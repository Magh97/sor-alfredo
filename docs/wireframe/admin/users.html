<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOR — Admin · Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#c65d3b', light: '#e08a5e', dark: '#8e3a25', foreground: '#fdf6ec' },
            secondary: { DEFAULT: '#5c7a3e', light: '#7fa056', dark: '#3d5528', foreground: '#fdf6ec' },
            accent:    { DEFAULT: '#e8a838', foreground: '#3d2b1f' },
            success:   '#4a7c3f',
            error:     '#b84c3b',
            warning:   '#d4992a',
            info:      '#5b7fa5',
            background:'#fdf6ec',
            surface:   '#f5edde',
            text:      { primary: '#3d2b1f', secondary: '#7a6b5d', muted: '#a6988a' },
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: system-ui, -apple-system, sans-serif; } .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; } </style>
</head>
<body class="h-screen flex bg-background">

  <!-- Sidebar -->
  <aside class="w-64 bg-surface border-r flex flex-col shrink-0">
    <div class="h-16 flex items-center px-6 border-b">
      <h1 class="text-xl font-bold text-primary font-display">SOR</h1>
    </div>
    <nav class="flex-1 py-4 space-y-1">
      <a href="catalog.html" class="flex items-center gap-3 px-6 py-3 text-sm font-medium text-text-secondary hover:bg-background">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M9 9h6"/></svg>
        Catalogo
      </a>
      <a href="users.html" class="flex items-center gap-3 px-6 py-3 text-sm font-medium bg-primary/10 text-primary border-r-2 border-primary">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        Usuarios
      </a>
      <a href="reports.html" class="flex items-center gap-3 px-6 py-3 text-sm font-medium text-text-secondary hover:bg-background">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Reportes
      </a>
    </nav>
    <div class="p-4 border-t text-xs text-text-muted">SOR v0.1</div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-surface border-b flex items-center justify-between px-6 shrink-0">
      <h2 class="text-lg font-semibold text-text-primary">Usuarios</h2>
      <div class="flex items-center gap-3">
        <span class="text-sm text-text-secondary">Admin</span>
        <div class="size-8 rounded-full bg-primary text-primary-foreground flex items-center justify-center text-sm font-bold">A</div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex gap-2">
          <select class="rounded-lg border border-text-muted/30 px-3 py-2 text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-primary">
            <option>Todos los roles</option>
            <option>Mesero</option>
            <option>Cajero</option>
            <option>Admin</option>
          </select>
          <select class="rounded-lg border border-text-muted/30 px-3 py-2 text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-primary">
            <option>Todos</option>
            <option>Activos</option>
            <option>Inactivos</option>
          </select>
        </div>
        <button class="bg-primary text-white rounded-lg px-4 py-2 text-sm font-semibold hover:bg-primary-dark active:scale-95 transition-all flex items-center gap-1.5">
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
          Agregar Usuario
        </button>
      </div>

      <table class="w-full text-sm bg-surface rounded-xl border border-text-muted/20">
        <thead class="bg-background border-b">
          <tr class="text-left text-text-secondary">
            <th class="px-4 py-3 font-medium">Nombre</th>
            <th class="px-4 py-3 font-medium">Email</th>
            <th class="px-4 py-3 font-medium">Rol</th>
            <th class="px-4 py-3 font-medium text-center">Activo</th>
            <th class="px-4 py-3 font-medium text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr>
            <td class="px-4 py-3 font-medium">Carlos M.</td>
            <td class="px-4 py-3 text-text-secondary">admin@restaurant.com</td>
            <td class="px-4 py-3"><span class="bg-primary/15 text-primary rounded-full px-2.5 py-0.5 text-xs font-medium">Admin</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-block size-2.5 rounded-full bg-success"></span></td>
            <td class="px-4 py-3 text-center"><button class="text-primary hover:text-primary text-sm mr-3">Editar</button><button class="text-error hover:text-error/80 text-sm">Desactivar</button></td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium">Miguel G.</td>
            <td class="px-4 py-3 text-text-secondary">mesero1@restaurant.com</td>
            <td class="px-4 py-3"><span class="bg-info/15 text-info rounded-full px-2.5 py-0.5 text-xs font-medium">Mesero</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-block size-2.5 rounded-full bg-success"></span></td>
            <td class="px-4 py-3 text-center"><button class="text-primary hover:text-primary text-sm mr-3">Editar</button><button class="text-error hover:text-error/80 text-sm">Desactivar</button></td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium">Ana L.</td>
            <td class="px-4 py-3 text-text-secondary">mesero2@restaurant.com</td>
            <td class="px-4 py-3"><span class="bg-info/15 text-info rounded-full px-2.5 py-0.5 text-xs font-medium">Mesero</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-block size-2.5 rounded-full bg-success"></span></td>
            <td class="px-4 py-3 text-center"><button class="text-primary hover:text-primary text-sm mr-3">Editar</button><button class="text-error hover:text-error/80 text-sm">Desactivar</button></td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium">Rosa H.</td>
            <td class="px-4 py-3 text-text-secondary">cajero1@restaurant.com</td>
            <td class="px-4 py-3"><span class="bg-success/15 text-success rounded-full px-2.5 py-0.5 text-xs font-medium">Cajero</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-block size-2.5 rounded-full bg-success"></span></td>
            <td class="px-4 py-3 text-center"><button class="text-primary hover:text-primary text-sm mr-3">Editar</button><button class="text-error hover:text-error/80 text-sm">Desactivar</button></td>
          </tr>
          <tr>
            <td class="px-4 py-3 font-medium">Pedro S.</td>
            <td class="px-4 py-3 text-text-secondary">pedro@restaurant.com</td>
            <td class="px-4 py-3"><span class="bg-info/15 text-info rounded-full px-2.5 py-0.5 text-xs font-medium">Mesero</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-block size-2.5 rounded-full bg-error"></span></td>
            <td class="px-4 py-3 text-center"><button class="text-primary hover:text-primary text-sm mr-3">Editar</button><button class="text-success hover:text-success/80 text-sm">Activar</button></td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>

  <!-- Modal: Usuario -->
  <div id="modal-user" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-surface rounded-xl shadow-modal w-full max-w-md">
      <div class="border-b px-6 py-4 rounded-t-xl flex items-center justify-between">
        <h3 class="text-lg font-semibold">Agregar Usuario</h3>
        <button onclick="hideModal('modal-user')" class="text-text-muted hover:text-text-secondary text-2xl leading-none">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <div><label class="block text-sm font-medium text-text-primary mb-1">Nombre</label><input type="text" class="w-full rounded-lg border border-text-muted/30 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"></div>
        <div><label class="block text-sm font-medium text-text-primary mb-1">Email</label><input type="email" class="w-full rounded-lg border border-text-muted/30 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"></div>
        <div id="password-field"><label class="block text-sm font-medium text-text-primary mb-1">Contrasena</label><input type="password" class="w-full rounded-lg border border-text-muted/30 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"></div>
        <div><label class="block text-sm font-medium text-text-primary mb-1">Rol</label><select class="w-full rounded-lg border border-text-muted/30 px-3 py-2 text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-primary"><option>Mesero</option><option>Cajero</option><option>Admin</option></select></div>
      </div>
      <div class="border-t px-6 py-4 rounded-b-xl flex justify-end gap-3">
        <button onclick="hideModal('modal-user')" class="px-4 py-2 rounded-lg border border-text-muted/30 text-sm font-medium hover:bg-background">Cancelar</button>
        <button onclick="hideModal('modal-user')" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-primary-dark">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
    document.querySelectorAll('.fixed.inset-0').forEach(function(el) {
      el.addEventListener('click', function(e) { if (e.target === el) hideModal(el.id); });
    });

    // Agregar Usuario button
    document.querySelector('main button').addEventListener('click', function() { showModal('modal-user'); });

    // Editar / Desactivar / Activar buttons
    document.querySelectorAll('table tbody button').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var text = btn.textContent.trim();
        if (text === 'Editar') {
          showModal('modal-user');
          document.getElementById('password-field').classList.add('hidden');
          document.querySelector('#modal-user h3').textContent = 'Editar Usuario';
        } else if (text === 'Desactivar') {
          btn.textContent = 'Activar';
          btn.className = 'text-success hover:text-success/80 text-sm';
          btn.closest('tr').querySelector('.inline-block.rounded-full').classList.replace('bg-success', 'bg-error');
        } else if (text === 'Activar') {
          btn.textContent = 'Desactivar';
          btn.className = 'text-error hover:text-error/80 text-sm';
          btn.closest('tr').querySelector('.inline-block.rounded-full').classList.replace('bg-error', 'bg-success');
        }
      });
    });

    // Reset modal state on close (when adding new user)
    // Close on "Agregar" button resets to fresh state
    var mainBtn = document.querySelector('main button');
    mainBtn.addEventListener('click', function() {
      document.getElementById('password-field').classList.remove('hidden');
      document.querySelector('#modal-user h3').textContent = 'Agregar Usuario';
    });
  </script>
</body>
</html>
