<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOR — Usuarios</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .role-badge { font-size: 0.7rem; padding: 2px 10px; border-radius: 9999px; font-weight: 500; }
  .modal-overlay { transition: opacity 0.2s ease; }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary:   { DEFAULT: '#c2572e', light: '#e07a4d', dark: '#8c2b17', foreground: '#fdfaf5' },
          secondary: { DEFAULT: '#527a34', light: '#7b9a4f', dark: '#3a4f24', foreground: '#fdfaf5' },
          accent:    { DEFAULT: '#e8a020', foreground: '#2c1a10' },
          success:   '#457a38',
          error:     '#b5452e',
          warning:   '#d49224',
          info:      '#4e769e',
          background:'#fdfaf5',
          surface:   '#f8f0e2',
          text:      { primary: '#2c1a10', secondary: '#665448', muted: '#8a7e72' },
        }
      }
    }
  }
</script>
</head>
<body class="bg-background text-[#2c1a10] font-sans min-h-screen flex">

<!-- Sidebar -->
<aside class="w-64 min-h-screen bg-[#2c1a10] text-[#fdfaf5] flex flex-col shrink-0">
  <div class="px-6 py-6">
    <h1 class="font-display font-bold text-2xl tracking-tight text-[#e07a4d]">SOR</h1>
    <p class="text-xs text-[#8a7e72] mt-1">Sistema de Órdenes Restaurante</p>
  </div>
  <nav class="flex-1 px-3 space-y-1">
    <a href="catalog.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] text-[#f8f0e2]/70 hover:bg-white/5 text-sm"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M9 9h6"/></svg> Catálogo</a>
    <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] bg-[#c2572e]/20 text-[#e07a4d] font-medium text-sm border-l-2 border-[#c2572e]"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg> Usuarios</a>
    <a href="reports.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] text-[#f8f0e2]/70 hover:bg-white/5 text-sm"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg> Reportes</a>
  </nav>
  <div class="px-6 py-4 border-t border-white/10">
    <p class="text-xs text-[#8a7e72]">Admin &middot; Miguel</p>
  </div>
</aside>

<!-- Main -->
<main class="flex-1 flex flex-col min-h-screen bg-white">
  <header class="flex items-center justify-between px-8 py-4 border-b border-text-muted/20 bg-white">
    <h2 class="font-display font-bold text-xl text-[#2c1a10]">Usuarios</h2>
    <div class="flex items-center gap-3">
      <span class="text-sm text-text-secondary">Admin</span>
      <div class="size-8 rounded-full bg-primary text-primary-foreground flex items-center justify-center text-sm font-bold font-display">A</div>
    </div>
  </header>

  <!-- Filters Card -->
  <div class="px-8 py-4">
    <div class="bg-surface rounded-[16px] border border-text-muted/15 shadow-sm">
      <div class="flex items-center gap-3 p-4">
        <div class="flex items-center gap-2 flex-1">
          <input type="text" id="searchInput" placeholder="Buscar usuario…" oninput="filterUsers()" class="px-3 py-2 text-sm border border-text-muted/20 rounded-[4px] bg-white focus:outline-none focus:ring-2 focus:ring-primary/30 w-48">
          <select id="roleFilter" onchange="filterUsers()" class="px-3 py-2 text-sm border border-text-muted/20 rounded-[4px] bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
            <option value="all">Todos los roles</option>
            <option value="admin">Administrador</option>
            <option value="mesero">Mesero</option>
            <option value="cajero">Cajero</option>
            <option value="cocina">Cocina</option>
          </select>
          <select id="statusFilter" onchange="filterUsers()" class="px-3 py-2 text-sm border border-text-muted/20 rounded-[4px] bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
            <option value="all">Todos los estados</option>
            <option value="active">Activos</option>
            <option value="inactive">Inactivos</option>
          </select>
        </div>
        <button onclick="openModal('add')" class="font-display font-bold text-sm px-4 py-2 rounded-[4px] bg-primary text-primary-foreground hover:bg-primary-dark active:scale-95 transition-all shrink-0">+ Agregar</button>
      </div>
    </div>
  </div>

  <!-- Users Table — wrapped in a card -->
  <div class="flex-1 px-8 py-4 overflow-auto">
    <div class="bg-surface rounded-[16px] border border-text-muted/15 shadow-sm min-h-[300px]">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-text-muted uppercase text-xs tracking-wider border-b border-text-muted/15">
            <th class="py-3 pl-6 font-medium">Nombre</th>
            <th class="py-3 font-medium">Email</th>
            <th class="py-3 font-medium">Rol</th>
            <th class="py-3 font-medium">Activo</th>
            <th class="py-3 pr-6 font-medium">Acciones</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal -->
<div id="userModal" class="modal-overlay fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
  <div class="bg-surface rounded-[8px] w-full max-w-md mx-4 shadow-xl">
    <div class="flex items-center justify-between px-6 py-4 border-b border-text-muted/20">
      <h3 id="modalTitle" class="font-display font-bold text-lg text-[#2c1a10]">Agregar Usuario</h3>
      <button onclick="closeModal()" class="text-[#8a7e72] hover:text-[#2c1a10] text-xl leading-none">&times;</button>
    </div>
    <form id="userForm" class="px-6 py-4 space-y-4" onsubmit="saveUser(event)">
      <input type="hidden" id="editIndex">
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Nombre completo</label>
        <input type="text" id="userName" required class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Correo electrónico</label>
        <input type="email" id="userEmail" required class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Rol</label>
        <select id="userRole" class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
          <option value="admin">Administrador</option>
          <option value="mesero">Mesero</option>
          <option value="cajero">Cajero</option>
          <option value="cocina">Cocina</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs font-medium text-[#665448]">Usuario activo</label>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="userActive" checked class="sr-only peer">
          <span class="w-11 h-6 rounded-full bg-gray-300 peer-checked:bg-[#457a38] transition-colors inline-block relative">
            <span class="absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
          </span>
        </label>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 py-2 text-sm border border-text-muted/20 rounded-[4px] text-[#665448] hover:bg-[#f8f0e2]">Cancelar</button>
        <button type="submit" class="flex-1 py-2 text-sm bg-[#c2572e] text-[#fdfaf5] rounded-[4px] font-display font-bold hover:bg-[#8c2b17]">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const roleColors = {
    admin:  { bg: '#c2572e20', text: '#8c2b17' },
    mesero: { bg: '#4e769e20', text: '#4e769e' },
    cajero: { bg: '#527a3420', text: '#3a4f24' },
    cocina: { bg: '#d4922420', text: '#b87a1a' },
  };
  const users = [
    { name:'Miguel Galván',   email:'miguel@sor.mx',      role:'admin',  active:true  },
    { name:'Ana López',       email:'ana@sor.mx',         role:'mesero', active:true  },
    { name:'Carlos Ruiz',     email:'carlos@sor.mx',      role:'cajero', active:true  },
    { name:'Mariana Herrera', email:'mariana@sor.mx',     role:'cocina', active:true  },
    { name:'Luis Fernández',  email:'luis@sor.mx',        role:'mesero', active:false },
  ];

  function renderUsers(list) {
    const tbody = document.getElementById('usersTableBody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="py-16 text-center text-text-muted">Sin resultados</td></tr>';
      return;
    }
    var html = '';
    list.forEach(function(u) {
      var idx = users.indexOf(u);
      var c = roleColors[u.role] || roleColors.mesero;
      var activeClass = u.active ? 'bg-success' : 'bg-error';
      var toggleClass = u.active ? 'text-error hover:text-error/80' : 'text-success hover:text-success/80';
      var toggleLabel = u.active ? 'Desactivar' : 'Activar';
      html += '<tr class="border-b border-text-muted/10 hover:bg-white/50 transition-colors">' +
        '<td class="py-3 pl-6 font-medium text-text-primary">' + u.name + '</td>' +
        '<td class="py-3 text-text-secondary">' + u.email + '</td>' +
        '<td class="py-3"><span class="role-badge capitalize" style="background:' + c.bg + ';color:' + c.text + '">' + u.role + '</span></td>' +
        '<td class="py-3"><span class="inline-block size-2.5 rounded-full ' + activeClass + '"></span></td>' +
        '<td class="py-3 pr-6 space-x-3">' +
          '<button onclick="openModal(\'edit\',' + idx + ')" class="text-sm font-medium text-primary hover:text-primary-dark transition-colors">Editar</button>' +
          '<button onclick="toggleUser(' + idx + ')" class="text-sm font-medium ' + toggleClass + ' transition-colors">' + toggleLabel + '</button>' +
        '</td>' +
      '</tr>';
    });
    tbody.innerHTML = html;
  }

  function filterUsers() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const roleFilter = document.getElementById('roleFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const filtered = users.filter(u => {
      const matchRole = roleFilter === 'all' || u.role === roleFilter;
      const matchStatus = statusFilter === 'all' || (statusFilter === 'active' ? u.active : !u.active);
      const matchSearch = u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
      return matchRole && matchStatus && matchSearch;
    });
    renderUsers(filtered);
  }

  function openModal(mode, idx) {
    document.getElementById('modalTitle').textContent = mode === 'add' ? 'Agregar Usuario' : 'Editar Usuario';
    document.getElementById('editIndex').value = mode === 'add' ? '' : idx;
    if (mode === 'edit' && idx != null) {
      const u = users[idx];
      document.getElementById('userName').value = u.name;
      document.getElementById('userEmail').value = u.email;
      document.getElementById('userRole').value = u.role;
      document.getElementById('userActive').checked = u.active;
    } else {
      document.getElementById('userForm').reset();
      document.getElementById('userActive').checked = true;
    }
    document.getElementById('userModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('userModal').classList.add('hidden');
  }

  function saveUser(e) {
    e.preventDefault();
    const idx = document.getElementById('editIndex').value;
    const data = {
      name: document.getElementById('userName').value,
      email: document.getElementById('userEmail').value,
      role: document.getElementById('userRole').value,
      active: document.getElementById('userActive').checked,
    };
    if (idx !== '') { users[parseInt(idx)] = data; }
    else { users.push(data); }
    closeModal();
    filterUsers();
  }

  function toggleUser(idx) {
    users[idx].active = !users[idx].active;
    filterUsers();
  }

  document.getElementById('userModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  filterUsers();
</script>

</body>
</html>
