<!-- ===== CATEGORY MODAL ===== -->
<div id="modalOverlay" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden">
  <div id="modalContent" class="w-full max-w-lg" style="background:#EBDCC4; border:6px solid #6B1A2A;">
    <div class="px-8 py-5 border-b-[4px] border-primary flex items-center justify-between">
      <h2 id="modalTitle" class="font-sans font-bold text-[20px] uppercase tracking-[-0.01em] text-espresso">NUEVA CATEGOR&Iacute;A</h2>
      <button onclick="closeModal()" class="font-mono text-[20px] text-text-muted hover:text-error leading-none">&times;</button>
    </div>
    <form id="categoryForm" class="px-8 py-6 space-y-5" onsubmit="saveCategory(event)">
      <input type="hidden" id="editId" value="">
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Nombre de Categor&iacute;a</label>
        <input type="text" id="catName" required
          class="w-full px-4 py-2.5 font-serif text-[16px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none;">
      </div>
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Orden de Visualizaci&oacute;n</label>
        <input type="number" id="catOrder" required min="1"
          class="w-full px-4 py-2.5 font-mono text-[16px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none;">
      </div>
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Notas</label>
        <textarea id="catNotes" rows="2"
          class="w-full px-4 py-2.5 font-script text-[16px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary resize-none"
          style="border-radius:0; outline:none;"
          placeholder="Descripci&oacute;n breve..."></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="closeModal()"
          class="px-6 py-2.5 border-2 border-text-muted text-text-secondary font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:border-text-primary transition-colors"
          style="border-radius:0;">CANCELAR</button>
        <button type="submit"
          class="px-6 py-2.5 border-[4px] border-primary bg-primary text-primary-foreground font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:bg-primary-light transition-colors"
          style="border-radius:0;">GUARDAR</button>
      </div>
    </form>
  </div>
</div>

<script>
let categories = [
  { id:1, name:'Platos Fuertes', order:1, notes:'Especialidades del chef', productCount:12 },
  { id:2, name:'Entradas', order:2, notes:'Para abrir el apetito', productCount:8 },
  { id:3, name:'Bebidas', order:3, notes:'Vinos, cocteles y refrescos', productCount:15 },
  { id:4, name:'Postres', order:4, notes:'Dulces finales', productCount:6 },
  { id:5, name:'Barra', order:5, notes:'Botanas y bebidas de barra', productCount:10 },
  { id:6, name:'Especiales', order:6, notes:'Temporada y Chef', productCount:4 },
];

let nextId = 7;

function renderGrid(data) {
  const grid = document.getElementById('categoryGrid');
  const empty = document.getElementById('emptyState');

  if (data.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');

  grid.innerHTML = data.map(c => `
    <div class="category-card p-6 flex flex-col">
      <div class="flex items-start justify-between mb-3">
        <div class="w-10 h-10 border-[3px] border-primary flex items-center justify-center font-mono font-bold text-[16px] text-primary shrink-0">${escapeHtml(String(c.order))}</div>
        <div class="flex gap-2">
          <button onclick="editCategory(${c.id})" class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] hover:underline" style="color:#6B1A2A;">EDITAR</button>
          <button onclick="deleteCategory(${c.id})" class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] hover:underline" style="color:#8B1A1A;">ELIMINAR</button>
        </div>
      </div>
      <h3 class="font-serif font-bold text-[24px] text-espresso leading-tight mb-2">${escapeHtml(c.name)}</h3>
      ${c.notes ? `<p class="ink-note text-[16px] mb-4">${escapeHtml(c.notes)}</p>` : '<div class="mb-4"></div>'}
      <div class="mt-auto flex items-center justify-between">
        <span class="font-mono text-[13px] text-text-muted uppercase tracking-[0.05em]">PRODUCTOS</span>
        <span class="font-mono font-bold text-[22px]" style="color:#2D4A22;">${c.productCount}</span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openModal(cat) {
  const modal = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  document.getElementById('editId').value = cat ? cat.id : '';
  document.getElementById('catName').value = cat ? cat.name : '';
  document.getElementById('catOrder').value = cat ? cat.order : '';
  document.getElementById('catNotes').value = cat ? (cat.notes||'') : '';
  title.textContent = cat ? 'EDITAR CATEGOR&Iacute;A' : 'NUEVA CATEGOR&Iacute;A';
  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function saveCategory(e) {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const name = document.getElementById('catName').value.trim();
  const order = parseInt(document.getElementById('catOrder').value);
  const notes = document.getElementById('catNotes').value.trim();

  if (editId) {
    const idx = categories.findIndex(c => c.id === parseInt(editId));
    if (idx >= 0) {
      categories[idx] = { ...categories[idx], name, order, notes };
    }
  } else {
    categories.push({ id: nextId++, name, order, notes, productCount: 0 });
  }

  categories.sort((a,b) => a.order - b.order);
  closeModal();
  renderGrid(categories);
}

function editCategory(id) {
  const c = categories.find(c => c.id === id);
  if (c) openModal(c);
}

function deleteCategory(id) {
  categories = categories.filter(c => c.id !== id);
  renderGrid(categories);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

function logout() {}

renderGrid(categories);
</script>

</body>
