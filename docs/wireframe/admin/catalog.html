<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOR — Catálogo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .toggle-switch { width: 44px; height: 24px; }
  .toggle-switch input:checked ~ .dot { transform: translateX(20px); }
  .toggle-switch input:checked ~ .track { background-color: #457a38; }
  .modal-overlay { transition: opacity 0.2s ease; }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary:   { DEFAULT: '#c2572e', light: '#e07a4d', dark: '#8c2b17', foreground: '#fdfaf5' },
          secondary: { DEFAULT: '#527a34', light: '#7b9a4f', dark: '#3a4f24', foreground: '#fdfaf5' },
          accent:    { DEFAULT: '#e8a020', foreground: '#2c1a10' },
          success:   '#457a38',
          error:     '#b5452e',
          warning:   '#d49224',
          info:      '#4e769e',
          background:'#fdfaf5',
          surface:   '#f8f0e2',
          text:      { primary: '#2c1a10', secondary: '#665448', muted: '#8a7e72' },
        }
      }
    }
  }
</script>
</head>
<body class="bg-background text-[#2c1a10] font-sans min-h-screen flex">

<!-- Sidebar -->
<aside class="w-64 min-h-screen bg-[#2c1a10] text-[#fdfaf5] flex flex-col shrink-0">
  <div class="px-6 py-6">
    <h1 class="font-display font-bold text-2xl tracking-tight text-[#e07a4d]">SOR</h1>
    <p class="text-xs text-[#8a7e72] mt-1">Sistema de Órdenes Restaurante</p>
  </div>
  <nav class="flex-1 px-3 space-y-1">
    <a href="catalog.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] bg-[#c2572e]/20 text-[#e07a4d] font-medium text-sm border-l-2 border-[#c2572e]">📦 Catálogo</a>
    <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] text-[#f8f0e2]/70 hover:bg-white/5 text-sm">👥 Usuarios</a>
    <a href="reports.html" class="flex items-center gap-3 px-4 py-2.5 rounded-[4px] text-[#f8f0e2]/70 hover:bg-white/5 text-sm">📊 Reportes</a>
  </nav>
  <div class="px-6 py-4 border-t border-white/10">
    <p class="text-xs text-[#8a7e72]">Admin &middot; Miguel</p>
  </div>
</aside>

<!-- Main -->
<main class="flex-1 flex flex-col min-h-screen bg-white">
  <!-- Header -->
  <header class="flex items-center justify-between px-8 py-4 border-b border-text-muted/20 bg-white">
    <h2 class="font-display font-bold text-xl text-[#2c1a10]">Catálogo</h2>
    <div class="flex items-center gap-3">
      <span class="text-sm text-text-secondary">Admin</span>
      <div class="size-8 rounded-full bg-primary text-primary-foreground flex items-center justify-center text-sm font-bold font-display">A</div>
    </div>
  </header>

  <!-- Filters Row — category cards + search + button all inline -->
  <div class="flex items-center gap-3 px-8 py-4 border-b border-text-muted/20 bg-white">
    <div class="flex items-center gap-2 flex-1 overflow-x-auto" id="cat-filters">
      <button class="cat-pill active px-4 py-2 rounded-[8px] text-sm font-medium bg-primary text-primary-foreground shadow-sm shrink-0 font-display" data-cat="all" onclick="filterByCategory(this,'all')">Todos</button>
      <button class="cat-pill px-4 py-2 rounded-[8px] text-sm font-medium bg-surface text-text-primary border border-text-muted/15 shadow-sm shrink-0 hover:border-primary/30 transition-colors font-display" data-cat="platos" onclick="filterByCategory(this,'platos')">Platos</button>
      <button class="cat-pill px-4 py-2 rounded-[8px] text-sm font-medium bg-surface text-text-primary border border-text-muted/15 shadow-sm shrink-0 hover:border-primary/30 transition-colors font-display" data-cat="bebidas" onclick="filterByCategory(this,'bebidas')">Bebidas</button>
      <button class="cat-pill px-4 py-2 rounded-[8px] text-sm font-medium bg-surface text-text-primary border border-text-muted/15 shadow-sm shrink-0 hover:border-primary/30 transition-colors font-display" data-cat="postres" onclick="filterByCategory(this,'postres')">Postres</button>
      <button class="cat-pill px-4 py-2 rounded-[8px] text-sm font-medium bg-surface text-text-primary border border-text-muted/15 shadow-sm shrink-0 hover:border-primary/30 transition-colors font-display" data-cat="entradas" onclick="filterByCategory(this,'entradas')">Entradas</button>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <input type="text" id="searchInput" placeholder="Buscar producto…" class="w-48 px-3 py-2 text-sm border border-text-muted/20 rounded-[4px] bg-white focus:outline-none focus:ring-2 focus:ring-primary/30" oninput="filterProducts()">
      <button onclick="openModal('add')" class="font-display font-bold text-sm px-4 py-2 rounded-[4px] bg-primary text-primary-foreground hover:bg-primary-dark active:scale-95 transition-all shrink-0">+ Nuevo</button>
    </div>
  </div>

  <!-- Product Card Grid -->
  <div class="flex-1 px-8 py-4 overflow-auto">
    <div id="productCardGrid" class="grid grid-cols-3 gap-4"></div>
  </div>
</main>

<!-- Modal -->
<div id="productModal" class="modal-overlay fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
  <div class="bg-surface rounded-[8px] w-full max-w-md mx-4 shadow-xl">
    <div class="flex items-center justify-between px-6 py-4 border-b border-text-muted/20">
      <h3 id="modalTitle" class="font-display font-bold text-lg text-[#2c1a10]">Nuevo Producto</h3>
      <button onclick="closeModal()" class="text-[#8a7e72] hover:text-[#2c1a10] text-xl leading-none">&times;</button>
    </div>
    <form id="productForm" class="px-6 py-4 space-y-4" onsubmit="saveProduct(event)">
      <input type="hidden" id="editIndex">
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Nombre del producto</label>
        <input type="text" id="prodName" required class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Categoría</label>
        <select id="prodCategory" class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
          <option value="platos">Platos</option>
          <option value="bebidas">Bebidas</option>
          <option value="postres">Postres</option>
          <option value="entradas">Entradas</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-[#665448] mb-1">Precio (MXN)</label>
        <input type="number" id="prodPrice" required min="0" step="0.01" class="w-full px-3 py-2 border border-text-muted/20 rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div class="flex items-center gap-3">
        <label class="text-xs font-medium text-[#665448]">Disponible</label>
        <label class="toggle-switch relative inline-block cursor-pointer">
          <input type="checkbox" id="prodAvailable" checked class="sr-only peer">
          <span class="track block w-11 h-6 rounded-full bg-gray-300 peer-checked:bg-[#457a38] transition-colors"></span>
          <span class="dot absolute left-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
        </label>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 py-2 text-sm border border-text-muted/20 rounded-[4px] text-[#665448] hover:bg-[#f8f0e2]">Cancelar</button>
        <button type="submit" class="flex-1 py-2 text-sm bg-[#c2572e] text-[#fdfaf5] rounded-[4px] font-display font-bold hover:bg-[#8c2b17]">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const products = [
    { name: 'Hamburguesa Clásica',  category: 'platos',   price: 120,  available: true  },
    { name: 'Pizza Margherita',     category: 'platos',   price: 150,  available: true  },
    { name: 'Tacos al Pastor',     category: 'entradas',  price: 85,   available: true  },
    { name: 'Ensalada César',      category: 'entradas',  price: 95,   available: true  },
    { name: 'Pasta Alfredo',       category: 'platos',    price: 110,  available: false },
    { name: 'Coca-Cola 355ml',     category: 'bebidas',   price: 35,   available: true  },
    { name: 'Agua de Horchata',    category: 'bebidas',   price: 40,   available: true  },
    { name: 'Tiramisú',            category: 'postres',   price: 85,   available: true  },
    { name: 'Flan de Caramelo',    category: 'postres',   price: 65,   available: true  },
    { name: 'Limonada Mineral',    category: 'bebidas',   price: 45,   available: false },
  ];
  let activeFilter = 'all';
  let editingIndex = null;

  function renderCards(list) {
    var grid = document.getElementById('productCardGrid');
    if (!list.length) {
      grid.innerHTML = '<p class="col-span-3 text-center text-text-muted py-16">Sin productos que mostrar</p>';
      return;
    }
    grid.innerHTML = list.map(function(p) {
      var idx = products.indexOf(p);
      return '<div class="bg-surface rounded-[16px] border border-text-muted/15 shadow-sm p-5 flex flex-col">' +
        '<div class="flex items-start justify-between mb-3">' +
          '<div>' +
            '<p class="font-display font-bold text-base text-text-primary">' + p.name + '</p>' +
            '<span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-medium bg-text-muted/10 text-text-secondary capitalize">' + p.category + '</span>' +
          '</div>' +
          '<span class="inline-block size-3 rounded-full shrink-0 mt-1 ' + (p.available ? 'bg-success' : 'bg-error') + '"></span>' +
        '</div>' +
        '<p class="font-display font-bold text-xl text-text-primary mt-2">$' + p.price.toFixed(2) + '</p>' +
        '<div class="flex items-center gap-3 mt-4 pt-3 border-t border-text-muted/10">' +
          '<button onclick="openModal(\'edit\',' + idx + ')" class="text-sm font-medium text-primary hover:text-primary-dark transition-colors">Editar</button>' +
          '<button onclick="toggleProduct(' + idx + ')" class="text-sm font-medium ' + (p.available ? 'text-error hover:text-error/80' : 'text-success hover:text-success/80') + ' transition-colors">' + (p.available ? 'Desactivar' : 'Activar') + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function filterProducts() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => {
      const matchCat = activeFilter === 'all' || p.category === activeFilter;
      const matchSearch = p.name.toLowerCase().includes(q);
      return matchCat && matchSearch;
    });
    renderCards(filtered);
  }

  function filterByCategory(btn, cat) {
    activeFilter = cat;
    document.querySelectorAll('#cat-filters .cat-pill').forEach(function(b) {
      b.classList.remove('active');
      b.className = 'cat-pill px-4 py-2 rounded-[8px] text-sm font-medium bg-surface text-text-primary border border-text-muted/15 shadow-sm shrink-0 hover:border-primary/30 transition-colors font-display';
    });
    btn.className = 'cat-pill active px-4 py-2 rounded-[8px] text-sm font-medium bg-primary text-primary-foreground shadow-sm shrink-0 font-display';
    filterProducts();
  }

  function openModal(mode, idx) {
    const modal = document.getElementById('productModal');
    document.getElementById('modalTitle').textContent = mode === 'add' ? 'Nuevo Producto' : 'Editar Producto';
    document.getElementById('editIndex').value = mode === 'add' ? '' : idx;
    if (mode === 'edit' && idx != null) {
      const p = products[idx];
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodAvailable').checked = p.available;
    } else {
      document.getElementById('productForm').reset();
      document.getElementById('prodAvailable').checked = true;
    }
    modal.classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('productModal').classList.add('hidden');
  }

  function saveProduct(e) {
    e.preventDefault();
    const idx = document.getElementById('editIndex').value;
    const data = {
      name: document.getElementById('prodName').value,
      category: document.getElementById('prodCategory').value,
      price: parseFloat(document.getElementById('prodPrice').value),
      available: document.getElementById('prodAvailable').checked,
    };
    if (idx !== '') {
      products[parseInt(idx)] = data;
    } else {
      products.push(data);
    }
    closeModal();
    filterProducts();
  }

  function toggleProduct(idx) {
    products[idx].available = !products[idx].available;
    filterProducts();
  }

  document.getElementById('productModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  renderCards(products);
</script>

</body>
</html>
