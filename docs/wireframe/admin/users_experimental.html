<head>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary:   { DEFAULT:'#6B1A2A', light:'#8B2535', dark:'#4A0F1B', foreground:'#F0E6D3' },

        accent:    { DEFAULT:'#C9A84C', foreground:'#2C1810' },
        success:'#2D4A22', error:'#8B1A1A', warning:'#C9A84C', info:'#3A5068',
        background:'#FFFFFF', surface:'#EBDCC4', 'surface-elevated':'#E5D4B8',
        espresso:'#2C1810',
        text:{primary:'#2C1810', secondary:'#5C4030', muted:'#8B7355'},

        sans:  ['"DM Sans"','"Helvetica Neue"', 'sans-serif'],
        script:['"Caveat"', 'cursive'],

<style>
  .bg-paper {
    background-color: #FFFFFF;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .shadow-paper {
    box-shadow: 0 1px 0 #C9A84C, 0 2px 0 #A08030, 0 3px 4px rgba(44,24,16,0.15);
  }
  .card-brutal {
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .toggle-rect { width:44px; height:22px; background:#8B7355; cursor:pointer; transition:background 0.15s; }
  .toggle-rect.active { background:#2D4A22; }
  .toggle-rect .knob { width:18px; height:18px; background:#F0E6D3; margin:2px; transition:transform 0.15s; }
  .toggle-rect.active .knob { transform:translateX(22px); }
  input:focus, select:focus { outline:none; }
  .modal-overlay { background:rgba(44,24,16,0.65); }
  .role-badge-admin    { border:2px solid #6B1A2A; color:#6B1A2A; }
  .role-badge-mesero   { border:2px solid #3A5068; color:#3A5068; }
  .role-badge-cajero   { border:2px solid #2D4A22; color:#2D4A22; }
  .role-badge-cocina   { border:2px solid #C9A84C; color:#C9A84C; }
  .ink-note { font-family:'Caveat',cursive; color:#8B7355; }
</style>
</head>
<body class="bg-paper min-h-screen flex font-sans text-text-primary">

<!-- ===== SIDEBAR ===== -->
<aside class="w-64 min-h-screen flex flex-col shrink-0" style="background:#2C1810; color:#F0E6D3;">
  <div class="px-6 py-8 border-b-4 border-accent">
    <h1 class="font-serif font-bold text-[28px] tracking-tight leading-none" style="color:#C9A84C;">SOR</h1>
    <p class="font-mono text-[10px] uppercase tracking-[0.2em] mt-1" style="color:#8B7355;">Sistema Operativo de Restaurante</p>
  </div>
  <nav class="flex-1 px-0 py-4">
    <div class="px-6 mt-1 mb-1 font-sans font-bold text-[10px] uppercase tracking-[0.2em]" style="color:#8B7355;">OPERACIONES</div>
    <a href="../caja/orders_experimental.html" class="flex items-center gap-3 px-6 py-3 border-l-[6px] border-transparent hover:border-primary/40 text-parchment/70 hover:text-parchment font-sans font-bold text-[12px] uppercase tracking-[0.1em] transition-colors">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="4" y="1" width="10" height="16" rx="1" stroke="currentColor" stroke-width="2"/><path d="M6 1h6" stroke="currentColor" stroke-width="2"/><line x1="6" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2"/><line x1="6" y1="10" x2="12" y2="10" stroke="currentColor" stroke-width="2"/><line x1="6" y1="13" x2="9" y2="13" stroke="currentColor" stroke-width="2"/></svg>

    <a href="../caja/register_experimental.html" class="flex items-center gap-3 px-6 py-3 border-l-[6px] border-transparent hover:border-primary/40 text-parchment/70 hover:text-parchment font-sans font-bold text-[12px] uppercase tracking-[0.1em] transition-colors">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="1" width="14" height="16" rx="1" stroke="currentColor" stroke-width="2"/><polyline points="5,9 8,12 13,6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Caja
    </a>
    <div class="px-6 mt-1 mb-1 font-sans font-bold text-[10px] uppercase tracking-[0.2em]" style="color:#8B7355;">ADMINISTRACIÓN</div>
    <a href="catalog_experimental.html" class="flex items-center gap-3 px-6 py-3 border-l-[6px] border-transparent hover:border-primary/40 text-parchment/70 hover:text-parchment font-sans font-bold text-[12px] uppercase tracking-[0.1em] transition-colors">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="10" y="1" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="1" y="10" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="10" y="10" width="7" height="7" stroke="currentColor" stroke-width="2"/></svg>
      Catálogo
    </a>
    <a href="users_experimental.html" class="flex items-center gap-3 px-6 py-3 border-l-[6px] border-primary text-accent font-sans font-bold text-[12px] uppercase tracking-[0.1em]" style="background:rgba(107,26,42,0.20);">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="5" r="3" stroke="#C9A84C" stroke-width="2"/><path d="M2 16c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="#C9A84C" stroke-width="2"/></svg>
      Usuarios
    </a>
    <a href="reports_experimental.html" class="flex items-center gap-3 px-6 py-3 border-l-[6px] border-transparent hover:border-primary/40 text-parchment/70 hover:text-parchment font-sans font-bold text-[12px] uppercase tracking-[0.1em] transition-colors">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="10" width="4" height="7" stroke="currentColor" stroke-width="2"/><rect x="7" y="5" width="4" height="12" stroke="currentColor" stroke-width="2"/><rect x="13" y="7" width="4" height="10" stroke="currentColor" stroke-width="2"/></svg>
      Reportes
    </a>
  </nav>
  <div class="px-6 py-4 border-t-4 border-accent">
    <p class="font-mono text-[12px]" style="color:#C9A84C;">E. Montenegro</p>
    <p class="font-mono text-[10px] uppercase tracking-[0.1em]" style="color:#8B7355;">Administrador General</p>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="flex-1 min-h-screen bg-white px-10 py-8">

  <!-- HEADER -->
  <div class="flex items-center justify-between pb-6 border-b-[6px] border-primary mb-10">
    <h1 class="font-sans font-bold text-[36px] uppercase tracking-[-0.02em] text-espresso">Usuarios</h1>
    <div class="flex items-center gap-3">
      <span class="font-mono text-[14px] text-text-secondary">SOR-ADM-001</span>
      <div class="w-11 h-11 border-[4px] border-primary flex items-center justify-center font-serif font-bold text-[18px] text-primary">EM</div>
    </div>
  </div>

  <!-- FILTERS CARD -->
  <div class="mb-10 p-6" style="background:#EBDCC4; border:6px solid #6B1A2A;">
    <div class="flex items-center gap-4 flex-wrap">
      <input type="text" id="searchInput" placeholder="BUSCAR POR NOMBRE O EMAIL..." oninput="applyFilters()"
        class="px-4 py-2 font-mono text-[13px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary w-64"
        style="outline:none; border-radius:0;">
      <select id="roleFilter" onchange="applyFilters()"
        class="px-4 py-2 font-mono text-[13px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
        style="outline:none; border-radius:0; -webkit-appearance:none; appearance:none;">
        <option value="">TODOS LOS ROLES</option>
        <option value="Admin">Admin</option>
        <option value="Mesero">Mesero</option>
        <option value="Cajero">Cajero</option>
        <option value="Cocina">Cocina</option>
      </select>
      <select id="statusFilter" onchange="applyFilters()"
        class="px-4 py-2 font-mono text-[13px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
        style="outline:none; border-radius:0; -webkit-appearance:none; appearance:none;">
        <option value="">TODOS LOS ESTADOS</option>
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
      </select>
      <div class="flex-1"></div>
      <button onclick="openModal()"
        class="px-6 py-2.5 border-[4px] border-primary bg-primary text-primary-foreground font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:bg-primary-light transition-colors"
        style="border-radius:0;">+ AGREGAR</button>
    </div>
  </div>

  <!-- USERS TABLE CARD -->
  <div style="background:#EBDCC4; border:6px solid #6B1A2A;">
    <div class="overflow-x-auto">
      <table class="w-full border-collapse" id="userTable">
        <thead>
          <tr style="background:rgba(107,26,42,0.08);">
            <th class="text-left px-6 py-4 font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-espresso border-b-2 border-primary">Nombre</th>
            <th class="text-left px-6 py-4 font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-espresso border-b-2 border-primary">Email</th>
            <th class="text-left px-6 py-4 font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-espresso border-b-2 border-primary">Rol</th>
            <th class="text-center px-6 py-4 font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-espresso border-b-2 border-primary">Activo</th>
            <th class="text-center px-6 py-4 font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-espresso border-b-2 border-primary">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- EMPTY STATE -->
  <div id="emptyState" class="hidden p-16 text-center" style="background:#EBDCC4; border:6px solid #6B1A2A; margin-top:0;">
    <p class="font-script text-[24px] leading-relaxed" style="color:#8B7355;">Esta hoja está en blanco.<br/>El primer trazo es el más importante.</p>
  </div>

</main>

<!-- ===== USER MODAL ===== -->
<div id="modalOverlay" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center hidden">
  <div id="modalContent" class="w-full max-w-lg" style="background:#EBDCC4; border:6px solid #6B1A2A;">
    <div class="px-8 py-5 border-b-[4px] border-primary flex items-center justify-between">
      <h2 id="modalTitle" class="font-sans font-bold text-[20px] uppercase tracking-[-0.01em] text-espresso">AGREGAR USUARIO</h2>
      <button onclick="closeModal()" class="font-mono text-[20px] text-text-muted hover:text-error leading-none">&times;</button>
    </div>
    <form id="userForm" class="px-8 py-6 space-y-5" onsubmit="saveUser(event)">
      <input type="hidden" id="editId" value="">
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Nombre Completo</label>
        <input type="text" id="userName" required
          class="w-full px-4 py-2.5 font-sans text-[16px] font-bold bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none;">
      </div>
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Correo Electrónico</label>
        <input type="email" id="userEmail" required
          class="w-full px-4 py-2.5 font-mono text-[14px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none;">
      </div>
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Rol</label>
        <select id="userRole" required
          class="w-full px-4 py-2.5 font-mono text-[14px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none; -webkit-appearance:none; appearance:none;">
          <option value="">-- SELECCIONAR --</option>
          <option value="Admin">Admin</option>
          <option value="Mesero">Mesero</option>
          <option value="Cajero">Cajero</option>
          <option value="Cocina">Cocina</option>
        </select>
      </div>
      <div>
        <label class="block font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary mb-1.5">Contraseña Temporal</label>
        <input type="password" id="userPassword" required
          class="w-full px-4 py-2.5 font-mono text-[14px] bg-white border-2 border-text-muted focus:border-[4px] focus:border-primary"
          style="border-radius:0; outline:none;" placeholder="········">
      </div>
      <div class="flex items-center gap-4">
        <span class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-text-secondary">Activo</span>
        <div id="toggleActive" class="toggle-rect active" onclick="this.classList.toggle('active')">
          <div class="knob"></div>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="closeModal()"
          class="px-6 py-2.5 border-2 border-text-muted text-text-secondary font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:border-text-primary transition-colors"
          style="border-radius:0;">CANCELAR</button>
        <button type="submit"
          class="px-6 py-2.5 border-[4px] border-primary bg-primary text-primary-foreground font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:bg-primary-light transition-colors"
          style="border-radius:0;">GUARDAR</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script>
let users = [
  { id:1, name:'Fernando Castillo', email:'f.castillo@sor.mx', role:'Admin',  active:true },
  { id:2, name:'María López',       email:'m.lopez@sor.mx',    role:'Mesero', active:true },
  { id:3, name:'Carlos Ruiz',       email:'c.ruiz@sor.mx',     role:'Cajero', active:true },
  { id:4, name:'Ana Martínez',      email:'a.martinez@sor.mx', role:'Cocina', active:true },
  { id:5, name:'Diego Ramírez',     email:'d.ramirez@sor.mx',  role:'Mesero', active:false },
];

let nextId = 6;

function roleBadgeClass(role) {
  const map = { 'Admin':'admin','Mesero':'mesero','Cajero':'cajero','Cocina':'cocina' };
  return 'role-badge-' + (map[role] || 'admin');
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  const table = document.getElementById('userTable').closest('.overflow-x-auto');

  if (data.length === 0) {
    tbody.innerHTML = '';
    table.style.display = 'none';
    empty.classList.remove('hidden');
    return;
  }

  table.style.display = '';
  empty.classList.add('hidden');

  tbody.innerHTML = data.map((u,i) => {
    const bg = i % 2 === 0 ? '#EBDCC4' : '#E5D4B8';
    const availColor = u.active ? '#2D4A22' : '#8B1A1A';
    return `
      <tr style="background:${bg}; border-bottom:1px solid #8B7355;">
        <td class="px-6 py-4">
          <span class="font-sans font-bold text-[16px] text-espresso">${escapeHtml(u.name)}</span>
        </td>
        <td class="px-6 py-4">
          <span class="font-mono text-[14px]" style="color:#5C4030;">${escapeHtml(u.email)}</span>
        </td>
        <td class="px-6 py-4">
          <span class="inline-block px-3 py-0.5 font-sans font-bold text-[10px] uppercase tracking-[0.1em] leading-normal ${roleBadgeClass(u.role)}">
            ${escapeHtml(u.role)}
          </span>
        </td>
        <td class="px-6 py-4 text-center">
          <div style="display:inline-block;width:12px;height:12px;background:${availColor};"></div>
          <span class="font-mono text-[11px] ml-2" style="color:${availColor};">${u.active ? 'SI' : 'NO'}</span>
        </td>
        <td class="px-6 py-4 text-center space-x-4">
          <button onclick="editUser(${u.id})" class="font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:underline" style="color:#6B1A2A;">EDITAR</button>
          <button onclick="toggleUser(${u.id})" class="font-sans font-bold text-[12px] uppercase tracking-[0.1em] hover:underline" style="color:#8B1A1A;">DESACTIVAR</button>
        </td>
      </tr>`;
  }).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const role = document.getElementById('roleFilter').value;
  const status = document.getElementById('statusFilter').value;

  let filtered = users;
  if (search) {
    filtered = filtered.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
  }
  if (role) {
    filtered = filtered.filter(u => u.role === role);
  }
  if (status !== '') {
    const active = status === '1';
    filtered = filtered.filter(u => u.active === active);
  }
  renderTable(filtered);
}

function openModal(user) {
  const modal = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const toggle = document.getElementById('toggleActive');

  document.getElementById('editId').value = user ? user.id : '';
  document.getElementById('userName').value = user ? user.name : '';
  document.getElementById('userEmail').value = user ? user.email : '';
  document.getElementById('userRole').value = user ? user.role : '';
  document.getElementById('userPassword').value = user ? '••••••••' : '';
  document.getElementById('userPassword').required = !user;
  toggle.classList.toggle('active', user ? user.active : true);
  title.textContent = user ? 'EDITAR USUARIO' : 'AGREGAR USUARIO';
  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function saveUser(e) {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const name = document.getElementById('userName').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  const role = document.getElementById('userRole').value;
  const active = document.getElementById('toggleActive').classList.contains('active');

  if (editId) {
    const idx = users.findIndex(u => u.id === parseInt(editId));
    if (idx >= 0) {
      users[idx] = { ...users[idx], name, email, role, active };
    }
  } else {
    users.push({ id: nextId++, name, email, role, active });
  }

  closeModal();
  applyFilters();
}

function editUser(id) {
  const u = users.find(u => u.id === id);
  if (u) openModal(u);
}

function toggleUser(id) {
  const u = users.find(u => u.id === id);
  if (u) {
    u.active = !u.active;
    applyFilters();
  }
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

renderTable(users);
</script>

</body>
</html>
