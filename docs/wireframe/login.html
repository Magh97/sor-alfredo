<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOR — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .role-card { transition: all 0.35s ease; }
  .shimmer { animation: shimmer 2.5s infinite linear; background: linear-gradient(90deg, transparent 0%, rgba(253,250,245,0.4) 50%, transparent 100%); }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary:   { DEFAULT: '#c2572e', light: '#e07a4d', dark: '#8c2b17', foreground: '#fdfaf5' },
          secondary: { DEFAULT: '#527a34', light: '#7b9a4f', dark: '#3a4f24', foreground: '#fdfaf5' },
          accent:    { DEFAULT: '#e8a020', foreground: '#2c1a10' },
          success:   '#457a38',
          error:     '#b5452e',
          warning:   '#d49224',
          info:      '#4e769e',
          background:'#fdfaf5',
          surface:   '#f8f0e2',
          text:      { primary: '#2c1a10', secondary: '#665448', muted: '#8a7e72' },
        }
      }
    }
  }
</script>
</head>
<body class="bg-[#fdfaf5] text-[#2c1a10] font-sans min-h-screen flex flex-col items-center justify-center px-4">

<!-- Logo -->
<div class="mb-8 text-center">
  <h1 class="font-display font-bold text-3xl tracking-tight text-[#e07a4d]">SOR</h1>
  <p class="text-xs text-[#8a7e72] mt-1">Sistema de Órdenes Restaurante</p>
</div>

<!-- Login Card -->
<div class="w-full max-w-sm bg-white rounded-[8px] shadow-lg border border-[#f8f0e2] p-8" id="loginCard">
  <h2 class="font-display font-bold text-xl text-center text-[#2c1a10] mb-6">¿Quién entra hoy?</h2>

  <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
    <div>
      <label class="block text-xs font-medium text-[#665448] mb-1">Correo electrónico</label>
      <input type="email" id="email" value="mesero1@restaurant.com" required
        class="w-full px-3 py-2 border border-[#f8f0e2] rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-[#c2572e]/30 bg-[#fdfaf5]"
        placeholder="tu@correo.com">
    </div>
    <div>
      <label class="block text-xs font-medium text-[#665448] mb-1">Contraseña</label>
      <input type="password" id="password" value="12345678" required
        class="w-full px-3 py-2 border border-[#f8f0e2] rounded-[4px] text-sm focus:outline-none focus:ring-2 focus:ring-[#c2572e]/30 bg-[#fdfaf5]"
        placeholder="••••••••">
    </div>
    <div id="errorMsg" class="hidden text-xs text-[#b5452e] bg-[#b5452e]/10 px-3 py-2 rounded-[4px]"></div>
    <button type="submit" class="w-full py-2.5 text-sm bg-[#c2572e] text-[#fdfaf5] rounded-[4px] font-display font-bold hover:bg-[#8c2b17] transition-colors">
      Entrar al restaurante
    </button>
  </form>
</div>

<!-- Role Transition Card -->
<div id="roleCard" class="hidden w-full max-w-sm mt-6 bg-white rounded-[8px] border p-6 shadow-lg role-card text-center">
  <div class="text-4xl mb-2" id="roleEmoji"></div>
  <h3 class="font-display font-bold text-lg text-[#2c1a10]" id="roleWelcome"></h3>
  <p class="text-sm mt-1" id="roleLabel"></p>
  <div class="mt-3 h-1 rounded-full w-full" id="roleBar"></div>
</div>

<!-- KDS Link -->
<p class="mt-8 text-xs text-[#8a7e72]">
  ¿Eres cocina? <a href="kds.html" class="text-[#c2572e] hover:underline">La pantalla de cocina no requiere acceso.</a>
</p>

<!-- Version -->
<p class="mt-4 text-[10px] text-[#8a7e72]">SOR v0.2</p>

<script>
  const roleConfig = {
    mesero: { emoji:'🧑‍🍳', label:'Mesero', color:'#4e769e', colorBg:'#4e769e20', colorBorder:'#4e769e40' },
    cajero: { emoji:'💳', label:'Cajero', color:'#457a38', colorBg:'#457a3820', colorBorder:'#457a3840' },
    admin:  { emoji:'⚙️', label:'Administrador', color:'#c2572e', colorBg:'#c2572e20', colorBorder:'#c2572e40' },
    cocina: { emoji:'👨‍🍳', label:'Cocina', color:'#d49224', colorBg:'#d4922420', colorBorder:'#d4922440' },
    error:  { emoji:'🚫', label:'', color:'#b5452e', colorBg:'#b5452e20', colorBorder:'#b5452e40' },
  };

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('errorMsg');
    const roleCard = document.getElementById('roleCard');

    if (!email || !password) {
      errorEl.textContent = 'Todos los campos son obligatorios.';
      errorEl.classList.remove('hidden');
      roleCard.classList.add('hidden');
      return;
    }

    let role = null;
    if (email.includes('mesero'))  role = 'mesero';
    else if (email.includes('cajero')) role = 'cajero';
    else if (email.includes('admin'))  role = 'admin';
    else if (email.includes('cocina')) role = 'cocina';

    if (!role) {
      const cfg = roleConfig.error;
      errorEl.textContent = 'Correo o contraseña incorrectos. Intenta de nuevo.';
      errorEl.classList.remove('hidden');
      showRoleCard(cfg, email.split('@')[0], '');
      return;
    }

    const cfg = roleConfig[role];
    errorEl.classList.add('hidden');
    showRoleCard(cfg, email.split('@')[0], cfg.label);
  }

  function showRoleCard(cfg, name, label) {
    const card = document.getElementById('roleCard');
    card.classList.remove('hidden');
    card.style.borderColor = cfg.colorBorder;
    card.style.background = cfg.colorBg;
    document.getElementById('roleEmoji').textContent = cfg.emoji;
    document.getElementById('roleWelcome').textContent = 'Bienvenido, ' + name.charAt(0).toUpperCase() + name.slice(1);
    document.getElementById('roleLabel').textContent = label;
    document.getElementById('roleLabel').style.color = cfg.color;
    document.getElementById('roleBar').style.background = cfg.color;

    card.style.opacity = '0';
    card.style.transform = 'translateY(10px)';
    requestAnimationFrame(() => {
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    });
  }
</script>

</body>
</html>
