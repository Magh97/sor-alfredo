<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOR — Mesas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .nav-item.active { color: #c2572e; }
  .nav-item.active .nav-dot { background: #c2572e; }
  .nav-dot { height: 3px; border-radius: 2px; transition: background 0.2s; }
  .table-card { transition: transform 0.15s ease; }
  .table-card:hover { transform: translateY(-2px); }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary:   { DEFAULT: '#c2572e', light: '#e07a4d', dark: '#8c2b17', foreground: '#fdfaf5' },
          secondary: { DEFAULT: '#527a34', light: '#7b9a4f', dark: '#3a4f24', foreground: '#fdfaf5' },
          accent:    { DEFAULT: '#e8a020', foreground: '#2c1a10' },
          success:   '#457a38',
          error:     '#b5452e',
          warning:   '#d49224',
          info:      '#4e769e',
          background:'#fdfaf5',
          surface:   '#f8f0e2',
          text:      { primary: '#2c1a10', secondary: '#665448', muted: '#8a7e72' },
        }
      }
    }
  }
</script>
</head>
<body class="bg-background text-[#2c1a10] font-sans min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-[#f8f0e2] bg-white">
  <h1 class="font-display font-bold text-lg text-[#2c1a10]">Mesas</h1>
  <div class="w-9 h-9 rounded-full bg-[#4e769e]/20 flex items-center justify-center text-sm font-bold text-[#4e769e]">MG</div>
</header>

<!-- Status Filter Chips -->
<div class="flex gap-2 px-6 py-3 overflow-x-auto bg-white/50">
  <button class="filter-chip active px-4 py-1.5 rounded-full text-sm font-medium bg-[#c2572e] text-[#fdfaf5]" data-status="all" onclick="filterByStatus(this,'all')">Todos</button>
  <button class="filter-chip px-4 py-1.5 rounded-full text-sm font-medium bg-[#f8f0e2] text-[#2c1a10] hover:bg-[#c2572e]/20" data-status="libre" onclick="filterByStatus(this,'libre')">Libres</button>
  <button class="filter-chip px-4 py-1.5 rounded-full text-sm font-medium bg-[#f8f0e2] text-[#2c1a10] hover:bg-[#c2572e]/20" data-status="ocupada" onclick="filterByStatus(this,'ocupada')">Ocupadas</button>
</div>

<!-- Table Grid -->
<div class="flex-1 px-4 py-4 overflow-auto">
  <div id="tablesGrid" class="grid grid-cols-2 gap-3"></div>
</div>

<!-- Bottom Nav -->
<nav class="flex border-t border-[#f8f0e2] bg-white">
  <a href="#" class="nav-item flex-1 flex flex-col items-center justify-center py-3 text-sm text-[#8a7e72]">
    <span>📋</span>
    <span class="text-xs mt-0.5">Órdenes</span>
    <span class="nav-dot w-12 mt-1 bg-transparent"></span>
  </a>
  <a href="tables.html" class="nav-item active flex-1 flex flex-col items-center justify-center py-3 text-sm text-[#c2572e] font-medium">
    <span>🪑</span>
    <span class="text-xs mt-0.5">Mesas</span>
    <span class="nav-dot w-12 mt-1 bg-[#c2572e]"></span>
  </a>
</nav>

<script>
  const statusLabels = { libre: 'Libre', ocupada: 'Ocupada', reservada: 'Reservada', limpieza: 'Limpieza' };
  const statusColors = {
    libre:     { bg: '#457a3820', text: '#457a38', dot: '#457a38' },
    ocupada:   { bg: '#b5452e20', text: '#b5452e', dot: '#b5452e' },
    reservada: { bg: '#d4922420', text: '#d49224', dot: '#d49224' },
    limpieza:  { bg: '#4e769e20', text: '#4e769e', dot: '#4e769e' },
  };

  const tables = [
    { num: 1,  seats: 4, status: 'libre',     order: null },
    { num: 2,  seats: 2, status: 'ocupada',   order: '#42' },
    { num: 3,  seats: 2, status: 'libre',     order: null },
    { num: 4,  seats: 6, status: 'limpieza',  order: null },
    { num: 5,  seats: 4, status: 'ocupada',   order: '#43' },
    { num: 6,  seats: 8, status: 'reservada', order: null },
    { num: 7,  seats: 6, status: 'reservada', order: null },
    { num: 8,  seats: 2, status: 'libre',     order: null },
    { num: 9,  seats: 4, status: 'ocupada',   order: '#44' },
    { num: 10, seats: 4, status: 'libre',     order: null },
    { num: 11, seats: 2, status: 'limpieza',  order: null },
    { num: 12, seats: 6, status: 'ocupada',   order: '#45' },
  ];
  let activeFilter = 'all';

  function renderTables(list) {
    const grid = document.getElementById('tablesGrid');
    if (!list.length) {
      grid.innerHTML = '<p class="col-span-2 text-center text-[#8a7e72] py-12 text-sm">Sin mesas que mostrar</p>';
      return;
    }
    grid.innerHTML = list.map(t => {
      const c = statusColors[t.status];
      return `
        <div class="table-card bg-white rounded-[8px] p-4 border border-[#f8f0e2] shadow-sm">
          <div class="flex items-start justify-between">
            <div>
              <p class="font-display font-bold text-xl text-[#2c1a10]">${t.num}</p>
              <p class="text-xs mt-1" style="background:${c.bg};color:${c.text};display:inline-block;padding:2px 10px;border-radius:9999px;font-weight:500">${statusLabels[t.status]}</p>
            </div>
            ${t.order ? `<span class="text-xs font-medium text-[#c2572e] bg-[#c2572e]/10 px-2 py-0.5 rounded-[4px]">${t.order}</span>` : ''}
          </div>
          <div class="flex items-center gap-1 mt-3 text-xs text-[#8a7e72]">
            <span>👤 ×${t.seats}</span>
          </div>
        </div>`;
    }).join('');
  }

  function filterByStatus(btn, status) {
    activeFilter = status;
    document.querySelectorAll('.filter-chip').forEach(b => {
      b.classList.remove('active','bg-[#c2572e]','text-[#fdfaf5]');
      b.classList.add('bg-[#f8f0e2]','text-[#2c1a10]');
    });
    btn.classList.remove('bg-[#f8f0e2]','text-[#2c1a10]');
    btn.classList.add('active','bg-[#c2572e]','text-[#fdfaf5]');
    const filtered = activeFilter === 'all' ? tables : tables.filter(t => t.status === activeFilter);
    renderTables(filtered);
  }

  renderTables(tables);
</script>

</body>
</html>
