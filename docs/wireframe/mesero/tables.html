<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SOR — Mesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#d97706', light: '#fbbf24', dark: '#92400e', foreground: '#ffffff' },
            accent:    { DEFAULT: '#16a34a', foreground: '#ffffff' },
            success:   '#22c55e',
            error:    '#dc2626',
            warning:  '#f59e0b',
            info:     '#3b82f6',
          },
        },
      },
    }
  </script>
  <style> body { font-family: system-ui, -apple-system, sans-serif; } </style>
</head>
<body class="h-screen flex flex-col bg-neutral-50 max-w-lg mx-auto">

  <!-- Top Bar -->
  <header class="bg-white border-b px-4 py-3 shrink-0">
    <div class="flex items-center justify-between">
      <span class="text-lg font-semibold text-neutral-900">Mesas</span>
      <span class="text-sm text-neutral-500 bg-neutral-100 rounded-full px-3 py-1">Mesa actual: Ninguna</span>
    </div>
  </header>

  <!-- Status Filters -->
  <div class="px-4 pt-3 pb-2">
    <div class="flex gap-2 overflow-x-auto pb-1" id="filters">
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-amber-600 text-white shrink-0" data-filter="all">Todos</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-neutral-200 text-neutral-600 shrink-0" data-filter="free">Libre</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-neutral-200 text-neutral-600 shrink-0" data-filter="occupied">Ocupada</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-neutral-200 text-neutral-600 shrink-0" data-filter="reserved">Reservada</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-neutral-200 text-neutral-600 shrink-0" data-filter="cleaning">Limpieza</button>
    </div>
  </div>

  <!-- Table Grid -->
  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-4">
    <div class="grid grid-cols-2 gap-3" id="table-grid">

      <!-- free -->
      <div class="bg-green-100 text-green-800 border-2 border-green-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="free">
        <span class="text-3xl font-bold">1</span>
        <span class="text-sm mt-1">Libre</span>
        <span class="text-xs text-neutral-500 mt-1">4p</span>
      </div>

      <!-- occupied with order -->
      <div class="bg-red-100 text-red-800 border-2 border-red-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="occupied">
        <span class="text-3xl font-bold">5</span>
        <span class="text-sm mt-1">Ocupada</span>
        <span class="text-xs bg-white/40 px-2 py-0.5 rounded-full mt-1">#42</span>
      </div>

      <!-- free -->
      <div class="bg-green-100 text-green-800 border-2 border-green-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="free">
        <span class="text-3xl font-bold">3</span>
        <span class="text-sm mt-1">Libre</span>
        <span class="text-xs text-neutral-500 mt-1">2p</span>
      </div>

      <!-- reserved -->
      <div class="bg-amber-100 text-amber-800 border-2 border-amber-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="reserved">
        <span class="text-3xl font-bold">7</span>
        <span class="text-sm mt-1">Reservada</span>
        <span class="text-xs text-neutral-500 mt-1">6p</span>
      </div>

      <!-- occupied with order -->
      <div class="bg-red-100 text-red-800 border-2 border-red-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="occupied">
        <span class="text-3xl font-bold">2</span>
        <span class="text-sm mt-1">Ocupada</span>
        <span class="text-xs bg-white/40 px-2 py-0.5 rounded-full mt-1">#44</span>
      </div>

      <!-- free -->
      <div class="bg-green-100 text-green-800 border-2 border-green-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="free">
        <span class="text-3xl font-bold">4</span>
        <span class="text-sm mt-1">Libre</span>
        <span class="text-xs text-neutral-500 mt-1">4p</span>
      </div>

      <!-- cleaning -->
      <div class="bg-blue-100 text-blue-800 border-2 border-blue-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="cleaning">
        <span class="text-3xl font-bold">6</span>
        <span class="text-sm mt-1">Limpieza</span>
        <span class="text-xs text-neutral-500 mt-1">2p</span>
      </div>

      <!-- occupied with order -->
      <div class="bg-red-100 text-red-800 border-2 border-red-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="occupied">
        <span class="text-3xl font-bold">8</span>
        <span class="text-sm mt-1">Ocupada</span>
        <span class="text-xs bg-white/40 px-2 py-0.5 rounded-full mt-1">#46</span>
      </div>

      <!-- free -->
      <div class="bg-green-100 text-green-800 border-2 border-green-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="free">
        <span class="text-3xl font-bold">9</span>
        <span class="text-sm mt-1">Libre</span>
        <span class="text-xs text-neutral-500 mt-1">4p</span>
      </div>

      <!-- free -->
      <div class="bg-green-100 text-green-800 border-2 border-green-300 rounded-xl aspect-square flex flex-col items-center justify-center min-h-[120px] cursor-pointer active:scale-95 transition-transform" data-status="free">
        <span class="text-3xl font-bold">10</span>
        <span class="text-sm mt-1">Libre</span>
        <span class="text-xs text-neutral-500 mt-1">6p</span>
      </div>

    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="h-16 bg-white border-t flex items-center justify-around shrink-0">
    <a href="orders.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-neutral-400">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Ordenes</span>
    </a>
    <a href="tables.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-amber-600">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="text-xs">Mesas</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-neutral-400">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs">Perfil</span>
    </a>
  </nav>

  <script>
    document.querySelectorAll('#filters button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#filters button').forEach(function(b) {
          b.className = 'px-4 py-2 rounded-full text-sm font-medium bg-neutral-200 text-neutral-600 shrink-0';
        });
        btn.className = 'px-4 py-2 rounded-full text-sm font-medium bg-amber-600 text-white shrink-0';
        var filter = btn.dataset.filter;
        document.querySelectorAll('#table-grid > div').forEach(function(cell) {
          cell.style.display = (filter === 'all' || cell.dataset.status === filter) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
