<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alfredo's — Mesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#c2572e', light: '#e07a4d', dark: '#8c2b17', foreground: '#fdfaf5' },
            secondary: { DEFAULT: '#527a34', light: '#7b9a4f', dark: '#3a4f24', foreground: '#fdfaf5' },
            accent:    { DEFAULT: '#e8a020', foreground: '#2c1a10' },
            success:   '#457a38',
            error:     '#b5452e',
            warning:   '#d49224',
            info:      '#4e769e',
            background:'#fdfaf5',
            surface:   '#f8f0e2',
            text:      { primary: '#2c1a10', secondary: '#665448', muted: '#8a7e72' },
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .table-card { transition: transform 0.12s ease; }
    .table-card:active { transform: scale(0.96); }

    @keyframes dropdown-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-enter { animation: dropdown-in 150ms ease-out; }
  </style>
</head>
<body class="h-screen flex flex-col bg-background max-w-lg mx-auto">

  <!-- Header -->
  <header class="bg-surface border-b border-text-muted/20 px-4 py-3 shrink-0 flex items-center justify-between">
    <h1 class="text-lg font-semibold text-text-primary font-display">Mesas</h1>

    <!-- Avatar — tap to open profile dropdown -->
    <div class="relative" id="profile-container">
      <button onclick="toggleProfile()" class="size-9 rounded-full bg-primary text-primary-foreground flex items-center justify-center text-sm font-bold active:scale-95 transition-transform font-display">
        M
      </button>

      <!-- Profile Dropdown -->
      <div id="profile-dropdown" class="hidden dropdown-enter absolute right-0 top-full mt-2 w-56 bg-surface rounded-[16px] shadow-lg border border-text-muted/20 overflow-hidden z-30">
        <div class="p-4 border-b border-text-muted/10">
          <div class="flex items-center gap-3">
            <div class="size-12 rounded-full bg-primary/15 text-primary flex items-center justify-center text-lg font-bold font-display">M</div>
            <div>
              <p class="text-sm font-semibold text-text-primary font-display">Miguel G.</p>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-info/15 text-info mt-0.5">
                <svg class="size-2.5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
                Mesero
              </span>
            </div>
          </div>
          <div class="mt-3 space-y-1 text-xs text-text-secondary">
            <p>mesero1@restaurant.com</p>
            <div class="flex justify-between">
              <span>Turno</span>
              <span class="font-medium text-text-primary">14:00 — 22:00</span>
            </div>
            <div class="flex justify-between">
              <span>Órdenes hoy</span>
              <span class="font-medium text-text-primary">14</span>
            </div>
          </div>
        </div>
        <button onclick="toggleProfile()" class="w-full text-left px-4 py-3 text-sm text-error font-medium hover:bg-error/5 active:bg-error/10 transition-colors flex items-center gap-2">
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Status Filter Chips -->
  <div class="px-4 pt-3 pb-2">
    <div class="flex gap-2 overflow-x-auto" id="filters">
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground shrink-0 active:scale-95 transition-transform" data-status="all">Todos</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-surface text-text-secondary shrink-0 active:scale-95 transition-transform" data-status="libre">Libres</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-surface text-text-secondary shrink-0 active:scale-95 transition-transform" data-status="ocupada">Ocupadas</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-surface text-text-secondary shrink-0 active:scale-95 transition-transform" data-status="reservada">Reservadas</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-surface text-text-secondary shrink-0 active:scale-95 transition-transform" data-status="limpieza">Limpieza</button>
    </div>
  </div>

  <!-- Table Grid -->
  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-4" id="table-grid">
  </main>

  <!-- Bottom Nav -->
  <nav class="h-16 bg-surface border-t border-text-muted/20 flex items-center justify-around shrink-0">
    <a href="orders.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-text-muted">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Órdenes</span>
    </a>
    <a href="tables.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-primary">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="text-xs font-medium">Mesas</span>
    </a>
  </nav>

  <script>
    var tables = [
      { num: 1,  seats: 4, status: 'libre',     order: null },
      { num: 2,  seats: 2, status: 'ocupada',   order: '#42' },
      { num: 3,  seats: 2, status: 'libre',     order: null },
      { num: 4,  seats: 6, status: 'limpieza',  order: null },
      { num: 5,  seats: 4, status: 'ocupada',   order: '#43' },
      { num: 6,  seats: 8, status: 'reservada', order: null },
      { num: 7,  seats: 6, status: 'reservada', order: null },
      { num: 8,  seats: 2, status: 'libre',     order: null },
      { num: 9,  seats: 4, status: 'ocupada',   order: '#44' },
      { num: 10, seats: 4, status: 'libre',     order: null },
      { num: 11, seats: 2, status: 'limpieza',  order: null },
      { num: 12, seats: 6, status: 'ocupada',   order: '#45' },
    ];

    var statusLabels = { libre:'Libre', ocupada:'Ocupada', reservada:'Reservada', limpieza:'Limpieza' };
    var statusColors = {
      libre:     { classes: 'bg-success/15 text-success border-success/30' },
      ocupada:   { classes: 'bg-error/15 text-error border-error/30' },
      reservada: { classes: 'bg-warning/15 text-warning border-warning/30' },
      limpieza:  { classes: 'bg-info/15 text-info border-info/30' },
    };
    var activeFilter = 'all';

    function renderTableCards(list) {
      var grid = document.getElementById('table-grid');
      if (!list.length) {
        grid.innerHTML = '<div class="flex flex-col items-center justify-center text-center py-16 text-text-muted"><svg class="size-12 mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><p class="text-sm">No hay mesas para mostrar</p></div>';
        return;
      }
      grid.innerHTML = '<div class="grid grid-cols-2 gap-3">' + list.map(function(t) {
        var c = statusColors[t.status];
        return '<div class="table-card bg-surface rounded-[16px] p-4 cursor-pointer border border-text-muted/20">' +
          '<div class="flex items-start justify-between">' +
            '<div>' +
              '<span class="font-display font-bold text-xl text-text-primary">' + t.num + '</span>' +
              '<span class="inline-block ml-2 px-2 py-0.5 rounded-full text-xs font-medium ' + c.classes.split(' ')[0] + ' ' + c.classes.split(' ')[1] + '">' + statusLabels[t.status] + '</span>' +
            '</div>' +
            (t.order ? '<span class="text-xs font-medium text-primary bg-primary/10 px-2 py-0.5 rounded-[4px]">' + t.order + '</span>' : '') +
          '</div>' +
          '<div class="flex items-center gap-1 mt-3 text-xs text-text-muted">' +
            '<span>' + t.seats + ' personas</span>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function toggleProfile() {
      var d = document.getElementById('profile-dropdown');
      d.classList.toggle('hidden');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      var container = document.getElementById('profile-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('profile-dropdown').classList.add('hidden');
      }
    });

    // Filter chips
    document.querySelectorAll('#filters button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#filters button').forEach(function(b) {
          b.className = 'px-4 py-2 rounded-full text-sm font-medium bg-surface text-text-secondary shrink-0 active:scale-95 transition-transform';
        });
        btn.className = 'px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground shrink-0 active:scale-95 transition-transform';
        var filter = btn.dataset.status;
        activeFilter = filter;
        var filtered = filter === 'all' ? tables : tables.filter(function(t) { return t.status === filter; });
        renderTableCards(filtered);
      });
    });

    renderTableCards(tables);
  </script>
</body>
</html>
