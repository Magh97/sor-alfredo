<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SOR — Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#c65d3b', light: '#e08a5e', dark: '#8e3a25', foreground: '#fdf6ec' },
            secondary: { DEFAULT: '#5c7a3e', light: '#7fa056', dark: '#3d5528', foreground: '#fdf6ec' },
            accent:    { DEFAULT: '#e8a838', foreground: '#3d2b1f' },
            success:   '#4a7c3f',
            error:     '#b84c3b',
            warning:   '#d4992a',
            info:      '#5b7fa5',
            background:'#fdf6ec',
            surface:   '#f5edde',
            text:      { primary: '#3d2b1f', secondary: '#7a6b5d', muted: '#a6988a' },
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</head>
<body class="h-screen flex flex-col bg-background max-w-lg mx-auto">

  <!-- Top Bar -->
  <header class="bg-surface border-b px-4 py-3 shrink-0">
    <h1 class="text-lg font-semibold text-text-primary font-display">Perfil</h1>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
    <!-- User Card -->
    <div class="bg-surface rounded-xl border border-text-muted/20 p-5 flex flex-col items-center">
      <div class="size-20 rounded-full bg-primary/15 text-primary flex items-center justify-center text-3xl font-bold mb-3">
        M
      </div>
      <h2 class="text-xl font-bold text-text-primary">Miguel G.</h2>
      <span class="inline-flex items-center gap-1 px-3 py-0.5 rounded-full text-xs font-medium bg-info/15 text-info mt-1.5">
        <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        Mesero
      </span>
      <p class="text-sm text-text-secondary mt-2">mesero1@restaurant.com</p>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-surface rounded-xl border border-text-muted/20 p-4 text-center">
        <p class="text-2xl font-bold text-text-primary">14</p>
        <p class="text-xs text-text-secondary mt-0.5">Ordenes Hoy</p>
      </div>
      <div class="bg-surface rounded-xl border border-text-muted/20 p-4 text-center">
        <p class="text-2xl font-bold text-success">$480</p>
        <p class="text-xs text-text-secondary mt-0.5">Propinas</p>
      </div>
      <div class="bg-surface rounded-xl border border-text-muted/20 p-4 text-center">
        <p class="text-2xl font-bold text-text-primary">6h</p>
        <p class="text-xs text-text-secondary mt-0.5">Turno</p>
      </div>
    </div>

    <!-- Turno Info -->
    <div class="bg-surface rounded-xl border border-text-muted/20 p-5">
      <h3 class="text-base font-semibold text-text-primary mb-3">Informacion de Turno</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-text-secondary">Inicio</span>
          <span class="font-medium">14:00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-text-secondary">Fin</span>
          <span class="font-medium">22:00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-text-secondary">Sucursal</span>
          <span class="font-medium">Restaurante Central</span>
        </div>
        <div class="flex justify-between">
          <span class="text-text-secondary">Mesa asignada</span>
          <span class="font-medium text-primary">Ninguna</span>
        </div>
      </div>
    </div>

    <!-- Logout -->
    <button class="w-full bg-surface border-2 border-error/30 text-error rounded-xl py-3.5 text-base font-semibold hover:bg-error/10 active:scale-[0.98] transition-all min-h-[48px]">
      Cerrar Sesion
    </button>

    <p class="text-center text-xs text-text-muted pb-4">SOR v0.1</p>
  </main>

  <!-- Bottom Nav -->
  <nav class="h-16 bg-surface border-t flex items-center justify-around shrink-0">
    <a href="orders.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-text-muted">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Ordenes</span>
    </a>
    <a href="tables.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-text-muted">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="text-xs">Mesas</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-primary">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs">Perfil</span>
    </a>
  </nav>

</body>
</html>
