<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SOR — Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#d97706', light: '#fbbf24', dark: '#92400e', foreground: '#ffffff' },
            accent:    { DEFAULT: '#16a34a', foreground: '#ffffff' },
            success:   '#22c55e',
            error:    '#dc2626',
            warning:  '#f59e0b',
            info:     '#3b82f6',
          },
        },
      },
    }
  </script>
  <style> body { font-family: system-ui, -apple-system, sans-serif; } </style>
</head>
<body class="h-screen flex flex-col bg-neutral-50 max-w-lg mx-auto">

  <!-- Top Bar -->
  <header class="bg-white border-b px-4 py-3 shrink-0">
    <h1 class="text-lg font-semibold text-neutral-900">Perfil</h1>
  </header>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
    <!-- User Card -->
    <div class="bg-white rounded-xl border border-neutral-200 p-5 flex flex-col items-center">
      <div class="size-20 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-3xl font-bold mb-3">
        M
      </div>
      <h2 class="text-xl font-bold text-neutral-900">Miguel G.</h2>
      <span class="inline-flex items-center gap-1 px-3 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 mt-1.5">
        <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        Mesero
      </span>
      <p class="text-sm text-neutral-500 mt-2">mesero1@restaurant.com</p>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-xl border border-neutral-200 p-4 text-center">
        <p class="text-2xl font-bold text-neutral-900">14</p>
        <p class="text-xs text-neutral-500 mt-0.5">Ordenes Hoy</p>
      </div>
      <div class="bg-white rounded-xl border border-neutral-200 p-4 text-center">
        <p class="text-2xl font-bold text-green-600">$480</p>
        <p class="text-xs text-neutral-500 mt-0.5">Propinas</p>
      </div>
      <div class="bg-white rounded-xl border border-neutral-200 p-4 text-center">
        <p class="text-2xl font-bold text-neutral-900">6h</p>
        <p class="text-xs text-neutral-500 mt-0.5">Turno</p>
      </div>
    </div>

    <!-- Turno Info -->
    <div class="bg-white rounded-xl border border-neutral-200 p-5">
      <h3 class="text-base font-semibold text-neutral-900 mb-3">Informacion de Turno</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-neutral-500">Inicio</span>
          <span class="font-medium">14:00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-neutral-500">Fin</span>
          <span class="font-medium">22:00</span>
        </div>
        <div class="flex justify-between">
          <span class="text-neutral-500">Sucursal</span>
          <span class="font-medium">Restaurante Central</span>
        </div>
        <div class="flex justify-between">
          <span class="text-neutral-500">Mesa asignada</span>
          <span class="font-medium text-amber-700">Ninguna</span>
        </div>
      </div>
    </div>

    <!-- Logout -->
    <button class="w-full bg-white border-2 border-red-300 text-red-600 rounded-xl py-3.5 text-base font-semibold hover:bg-red-50 active:scale-[0.98] transition-all min-h-[48px]">
      Cerrar Sesion
    </button>

    <p class="text-center text-xs text-neutral-400 pb-4">SOR v0.1</p>
  </main>

  <!-- Bottom Nav -->
  <nav class="h-16 bg-white border-t flex items-center justify-around shrink-0">
    <a href="orders.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-neutral-400">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Ordenes</span>
    </a>
    <a href="tables.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-neutral-400">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="text-xs">Mesas</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-amber-600">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs">Perfil</span>
    </a>
  </nav>

</body>
</html>
