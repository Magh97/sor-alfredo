<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alfredo's — Nueva Reserva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT:'#6B1A2A', light:'#8B2535', dark:'#4A0F1B', foreground:'#F0E6D3' },
            secondary: { DEFAULT:'#2D4A22', light:'#3D6230', dark:'#1C3015', foreground:'#F0E6D3' },
            accent:    { DEFAULT:'#C9A84C', foreground:'#2C1810' },
            success:'#2D4A22', error:'#8B1A1A', warning:'#C9A84C', info:'#3A5068',
            background:'#FFFFFF', surface:'#EBDCC4', 'surface-elevated':'#E5D4B8',
            text:{primary:'#2C1810', secondary:'#5C4030', muted:'#8B7355'},
          },
          fontFamily: {
            serif: ["'Playfair Display'", 'Georgia', 'serif'],
            mono: ["'JetBrains Mono'", "'Courier New'", 'monospace'],
            sans: ["'DM Sans'", "'Helvetica Neue'", 'sans-serif'],
            script: ["'Caveat'", 'cursive'],
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'DM Sans', 'Helvetica Neue', sans-serif; }

    .bg-paper {
      background-color: #FFFFFF;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04' /%3E%3C/svg%3E");
    }

    .shadow-paper {
      box-shadow: 0 1px 0 #C9A84C, 0 2px 0 #A08030, 0 3px 4px rgba(44,24,16,0.15);
    }

    .card-brutal {
      clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
    }

    .border-torn {
      border-top: 3px solid #6B1A2A;
      position: relative;
    }
    .border-torn::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 0;
      width: 100%;
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        transparent, transparent 8px,
        #F0E6D3 8px, #F0E6D3 12px,
        transparent 12px, transparent 20px,
        #F0E6D3 20px, #F0E6D3 22px,
        transparent 22px, transparent 30px
      );
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-paper max-w-lg mx-auto select-none">

  <!-- Header -->
  <header class="shrink-0 px-4 pt-4 pb-3 flex items-center justify-between" style="border-bottom:6px solid #6B1A2A;">
    <a href="tables_experimental.html" class="font-sans font-bold text-[14px] uppercase tracking-[0.1em] text-text-muted hover:text-text-primary active:opacity-60 transition-opacity select-none">
      &larr; Volver
    </a>
    <h1 class="font-sans font-bold text-[24px] uppercase tracking-[-0.02em] text-text-primary leading-none select-none">
      Nueva Reserva
    </h1>
    <div class="w-14"></div>
  </header>

  <!-- Form -->
  <main class="flex-1 overflow-y-auto px-4 pt-4 pb-24">

    <!-- Datos del Cliente -->
    <div class="bg-surface shadow-paper p-4 mb-4" style="background:#EBDCC4; border:6px solid #6B1A2A; border-radius:0;">
      <h2 class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-accent mb-4" style="color:#C9A84C;">Datos del Cliente</h2>

      <label class="block font-sans font-bold text-[12px] uppercase tracking-[0.1em] text-text-secondary mb-1">Nombre</label>
      <input id="nombre" type="text" placeholder="" class="w-full px-3 py-2 font-sans text-[16px] text-text-primary bg-white"
        style="border:4px solid #8B7355; border-radius:0; outline:none;"
        onfocus="this.style.borderColor='#6B1A2A';"
        onblur="this.style.borderColor='#8B7355';">

      <div class="mt-4">
        <label class="block font-sans font-bold text-[12px] uppercase tracking-[0.1em] text-text-secondary mb-1">Teléfono</label>
        <input id="telefono" type="tel" placeholder="55-1234-5678" class="w-full px-3 py-2 font-mono text-[16px] text-text-primary bg-white"
          style="border:4px solid #8B7355; border-radius:0; outline:none;"
          onfocus="this.style.borderColor='#6B1A2A';"
          onblur="this.style.borderColor='#8B7355';">
      </div>

      <div class="mt-4">
        <label class="block font-sans font-bold text-[12px] uppercase tracking-[0.1em] text-text-secondary mb-1">Personas</label>
        <select id="personas" class="w-full px-3 py-2 font-sans text-[16px] text-text-primary bg-white"
          style="border:4px solid #8B7355; border-radius:0; outline:none;"
          onfocus="this.style.borderColor='#6B1A2A';"
          onblur="this.style.borderColor='#8B7355';">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="12+">12+</option>
        </select>
      </div>
    </div>

    <!-- Fecha y Hora -->
    <div class="bg-surface shadow-paper p-4 mb-4" style="background:#EBDCC4; border:6px solid #6B1A2A; border-radius:0;">
      <h2 class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-accent mb-4" style="color:#C9A84C;">Fecha y Hora</h2>

      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block font-sans font-bold text-[12px] uppercase tracking-[0.1em] text-text-secondary mb-1">Fecha</label>
          <input id="fecha" type="date" class="w-full px-3 py-2 font-sans text-[16px] text-text-primary bg-white"
            style="border:4px solid #8B7355; border-radius:0; outline:none;"
            onfocus="this.style.borderColor='#6B1A2A';"
            onblur="this.style.borderColor='#8B7355';">
        </div>
        <div class="flex-1">
          <label class="block font-sans font-bold text-[12px] uppercase tracking-[0.1em] text-text-secondary mb-1">Hora</label>
          <select id="hora" class="w-full px-3 py-2 font-sans text-[16px] text-text-primary bg-white"
            style="border:4px solid #8B7355; border-radius:0; outline:none;"
            onfocus="this.style.borderColor='#6B1A2A';"
            onblur="this.style.borderColor='#8B7355';">
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
            <option value="20:00">20:00</option>
            <option value="21:00">21:00</option>
            <option value="22:00">22:00</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Mesa (Opcional) -->
    <div class="bg-surface shadow-paper p-4 mb-4" style="background:#EBDCC4; border:6px solid #6B1A2A; border-radius:0;">
      <h2 class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-accent mb-4" style="color:#C9A84C;">Mesa (Opcional)</h2>

      <select id="mesa" class="w-full px-3 py-2 font-sans text-[16px] text-text-primary bg-white"
        style="border:4px solid #8B7355; border-radius:0; outline:none;"
        onfocus="this.style.borderColor='#6B1A2A';"
        onblur="this.style.borderColor='#8B7355';">
        <option value="">Sin mesa asignada</option>
        <option value="1">Mesa 1</option>
        <option value="2">Mesa 2</option>
        <option value="3">Mesa 3</option>
        <option value="4">Mesa 4</option>
        <option value="5">Mesa 5</option>
        <option value="6">Mesa 6</option>
        <option value="7">Mesa 7</option>
        <option value="8">Mesa 8</option>
        <option value="9">Mesa 9</option>
        <option value="10">Mesa 10</option>
        <option value="11">Mesa 11</option>
        <option value="12">Mesa 12</option>
      </select>
    </div>

    <!-- Notas -->
    <div class="bg-surface shadow-paper p-4 mb-4" style="background:#EBDCC4; border:6px solid #6B1A2A; border-radius:0;">
      <h2 class="font-sans font-bold text-[11px] uppercase tracking-[0.1em] text-accent mb-4" style="color:#C9A84C;">Notas</h2>

      <textarea id="notas" rows="2" placeholder="" class="w-full px-3 py-2 font-script text-[18px] text-text-primary bg-white resize-none"
        style="border:4px solid #8B7355; border-radius:0; outline:none;"
        onfocus="this.style.borderColor='#6B1A2A';"
        onblur="this.style.borderColor='#8B7355';"></textarea>
    </div>

    <!-- Submit -->
    <div class="mb-4">
      <button id="crear-btn" onclick="crearReserva()" class="w-full py-4 font-sans font-bold text-[16px] uppercase tracking-[0.1em] active:scale-95 transition-all shadow-paper select-none"
        style="background:#6B1A2A; color:#F0E6D3; border:6px solid #6B1A2A; border-radius:0;">
        Crear Reservación
      </button>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 font-sans font-bold text-[12px] uppercase tracking-[0.1em] border-[4px] px-4 py-3 z-50 shadow-paper" style="border-radius:0;transition:all 0.3s ease;"></div>

  <script>
    var fechaInput = document.getElementById('fecha');
    if (fechaInput) {
      var today = new Date();
      var dd = String(today.getDate()).padStart(2, '0');
      var mm = String(today.getMonth() + 1).padStart(2, '0');
      var yyyy = today.getFullYear();
      fechaInput.value = dd + '/' + mm + '/' + yyyy;
    }

    function crearReserva() {
      var nombre = document.getElementById('nombre').value.trim();
      if (!nombre) {
        var input = document.getElementById('nombre');
        input.style.borderColor = '#8B1A1A';
        input.focus();
        showToast('El nombre del cliente es obligatorio', 'error');
        return;
      }

      showToast('Reserva creada', 'success');
      setTimeout(function() {
        window.location.href = 'tables_experimental.html';
      }, 800);
    }

    function showToast(message, type) {
      type = type || 'success';
      var toast = document.getElementById('toast');
      toast.textContent = message;
      if (type === 'success') {
        toast.style.borderColor = '#2D4A22';
        toast.style.color = '#2D4A22';
        toast.style.backgroundColor = '#FFFFFF';
      } else {
        toast.style.borderColor = '#8B1A1A';
        toast.style.color = '#8B1A1A';
        toast.style.backgroundColor = '#FFFFFF';
      }
      toast.classList.remove('hidden');
      setTimeout(function() { toast.classList.add('hidden'); }, 2500);
    }
  </script>
</body>
</html>
