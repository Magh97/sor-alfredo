<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SOR — Mis Ordenes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   { DEFAULT: '#c65d3b', light: '#e08a5e', dark: '#8e3a25', foreground: '#fdf6ec' },
            secondary: { DEFAULT: '#5c7a3e', light: '#7fa056', dark: '#3d5528', foreground: '#fdf6ec' },
            accent:    { DEFAULT: '#e8a838', foreground: '#3d2b1f' },
            success:   '#4a7c3f',
            error:     '#b84c3b',
            warning:   '#d4992a',
            info:      '#5b7fa5',
            background:'#fdf6ec',
            surface:   '#f5edde',
            text:      { primary: '#3d2b1f', secondary: '#7a6b5d', muted: '#a6988a' },
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</head>
<body class="h-screen flex flex-col bg-background max-w-lg mx-auto">

  <!-- Top Bar -->
  <header class="bg-surface border-b px-4 py-3 shrink-0">
    <h1 class="text-lg font-semibold text-text-primary font-display">Mis Ordenes</h1>
  </header>

  <!-- Status Tabs -->
  <div class="px-4 pt-3 pb-2">
    <div class="flex gap-2 overflow-x-auto pb-1" id="tabs">
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground shrink-0" data-status="all">Todas</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-text-muted/20 text-text-secondary shrink-0" data-status="in_kitchen">En Cocina</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-text-muted/20 text-text-secondary shrink-0" data-status="ready">Listas</button>
      <button class="px-4 py-2 rounded-full text-sm font-medium bg-text-muted/20 text-text-secondary shrink-0" data-status="delivered">Entregadas</button>
    </div>
  </div>

  <!-- Order Cards -->
  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-4">
    <div class="space-y-3" id="order-list">

      <!-- Card: in_kitchen -->
      <div class="bg-surface border border-text-muted/20 rounded-xl p-4 cursor-pointer active:scale-[0.98] transition-transform" data-status="in_kitchen">
        <div class="flex items-center justify-between mb-2">
          <span class="text-lg font-semibold">Mesa 5</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-warning/15 text-warning">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 6v6l4 2"/></svg>
            En Cocina
          </span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-text-secondary">4 items</span>
          <span class="font-semibold text-text-primary">$450.00</span>
        </div>
        <div class="text-xs text-text-muted mt-1">Hace 8 min · #42</div>
      </div>

      <!-- Card: in_kitchen -->
      <div class="bg-surface border border-text-muted/20 rounded-xl p-4 cursor-pointer active:scale-[0.98] transition-transform" data-status="in_kitchen">
        <div class="flex items-center justify-between mb-2">
          <span class="text-lg font-semibold">Mesa 2</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-warning/15 text-warning">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 6v6l4 2"/></svg>
            En Cocina
          </span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-text-secondary">5 items</span>
          <span class="font-semibold text-text-primary">$680.50</span>
        </div>
        <div class="text-xs text-text-muted mt-1">Hace 2 min · #44</div>
      </div>

      <!-- Card: ready -->
      <div class="bg-surface border border-text-muted/20 rounded-xl p-4 cursor-pointer active:scale-[0.98] transition-transform" data-status="ready">
        <div class="flex items-center justify-between mb-2">
          <span class="text-lg font-semibold">Mesa 3</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-info/15 text-info">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
            Lista
          </span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-text-secondary">3 items</span>
          <span class="font-semibold text-text-primary">$320.00</span>
        </div>
        <div class="text-xs text-text-muted mt-1">Hace 15 min · #40</div>
      </div>

      <!-- Card: delivered -->
      <div class="bg-surface border border-text-muted/20 rounded-xl p-4 cursor-pointer active:scale-[0.98] transition-transform" data-status="delivered">
        <div class="flex items-center justify-between mb-2">
          <span class="text-lg font-semibold">Mesa 7</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-secondary/15 text-secondary">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12h22M12 1v22"/></svg>
            Entregada
          </span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-text-secondary">2 items</span>
          <span class="font-semibold text-text-primary">$185.00</span>
        </div>
        <div class="text-xs text-text-muted mt-1">Hace 25 min · #38</div>
        <button class="mt-3 w-full bg-primary text-primary-foreground rounded-lg py-2.5 text-sm font-bold hover:bg-primary-dark active:scale-[0.98] transition-colors font-display">
          Generar Cuenta
        </button>
      </div>

      <!-- Card: paid -->
      <div class="bg-surface border border-text-muted/20 rounded-xl p-4 cursor-pointer active:scale-[0.98] transition-transform" data-status="paid">
        <div class="flex items-center justify-between mb-2">
          <span class="text-lg font-semibold">Mesa 4</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-success/15 text-success">
            <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/></svg>
            Pagada
          </span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-text-secondary">3 items</span>
          <span class="font-semibold text-text-primary">$295.00</span>
        </div>
        <div class="text-xs text-text-muted mt-1">Hace 45 min · #35</div>
      </div>

    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="h-16 bg-surface border-t flex items-center justify-around shrink-0">
    <a href="orders.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-primary">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-xs">Ordenes</span>
    </a>
    <a href="tables.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-text-muted">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span class="text-xs">Mesas</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center justify-center gap-1 h-full min-w-[64px] text-text-muted">
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs">Perfil</span>
    </a>
  </nav>

  <script>
    document.querySelectorAll('#tabs button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#tabs button').forEach(function(b) {
          b.className = 'px-4 py-2 rounded-full text-sm font-medium bg-text-muted/20 text-text-secondary shrink-0';
        });
        btn.className = 'px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground shrink-0';
        var filter = btn.dataset.status;
        document.querySelectorAll('#order-list > div').forEach(function(card) {
          card.style.display = (filter === 'all' || card.dataset.status === filter) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
